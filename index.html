<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Word Hopper - Typing Practice Game</title>
  <meta name="description" content="A hopping game for word typing practice. Type words to jump through obstacles, improve your typing speed and WPM.">
  <meta name="keywords" content="typing game, typing practice, word game, WPM, keyboard game, typing speed, 打字游戏, 打字练习, 英文打字, 键盘练习">
  <meta property="og:title" content="Word Hopper - Typing Practice Game | 打字练习游戏">
  <meta property="og:description" content="A hopping game for word typing practice. Type words to jump through obstacles, improve your typing speed and WPM. 跳跃打字练习游戏，边玩边提升打字速度。">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Word Hopper - Typing Practice Game">
  <meta name="twitter:description" content="A hopping game for word typing practice. Type words to jump through obstacles.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=JetBrains+Mono:wght@400;700&family=Noto+Sans+SC:wght@400;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #F0F7F3; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
    body.ios-layout { align-items: flex-start; flex-direction: column; }
    #game-shell { width: 70vw; aspect-ratio: 16 / 9; }
    #game-shell canvas { display: block; width: 100% !important; height: auto !important; outline: none; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.08), 0 8px 48px rgba(0,0,0,0.06); }
    #game-input { position: absolute; top: -100px; left: -100px; width: 1px; height: 1px; opacity: 0; }
    #ios-input-bar { display: none; width: 100%; padding: 8px 12px; background: rgba(22,163,74,0.92); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); z-index: 1000; align-items: center; gap: 8px; }
    #ios-input-bar.active { display: flex; }
    #ios-input-field { flex: 1; height: 40px; border-radius: 10px; border: 1.5px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.95); color: #1a1a1a; font-family: Quicksand, sans-serif; font-size: 16px; font-weight: 600; padding: 0 14px; outline: none; -webkit-appearance: none; }
    #ios-input-field::placeholder { color: #9CA3AF; font-weight: 400; }
    #ios-input-field:focus { border-color: #15803D; box-shadow: 0 0 0 2px rgba(22,163,74,0.2); }
    #mobile-blocker { display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; font-family: Quicksand, sans-serif; color: #15803D; padding: 32px; }
    #mobile-blocker h2 { font-size: 24px; font-weight: 700; margin-bottom: 12px; }
    #mobile-blocker p { font-size: 15px; color: #6B7280; max-width: 300px; line-height: 1.6; }
    #mobile-tip { display: none; font-family: Quicksand, sans-serif; font-size: 12px; color: #9CA3AF; text-align: center; padding: 6px 12px; line-height: 1.4; }
    #github-link { display: none; }
    #jump-btn { display: none; position: fixed; bottom: 24px; right: 24px; width: 72px; height: 72px; border-radius: 50%; background: rgba(22,163,74,0.85); color: #fff; font-family: Quicksand, sans-serif; font-size: 14px; font-weight: 700; border: none; z-index: 1000; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    #jump-btn:active { background: rgba(22,163,74,1); transform: scale(0.92); }
    @media (max-width: 767px), (pointer: coarse) {
      body { align-items: flex-start; flex-direction: column; }
      #mobile-tip { display: block; }
      #game-shell { width: 100vw; }
      #game-shell canvas { width: 100% !important; height: 100% !important; border-radius: 0; box-shadow: none; }
      #jump-btn { display: block; }
      #github-link { display: none; }
    }
  </style>
</head>
<body tabindex="0">
  <div id="mobile-tip">Mobile is for preview only. Best played with a physical keyboard on desktop.</div>
  <div id="game-shell" aria-label="Word Hopper game"></div>
  <input id="game-input" type="text" autocomplete="off" autofocus>
  <div id="ios-input-bar">
    <input id="ios-input-field" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Type here...">
  </div>
  <button id="jump-btn">JUMP</button>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
