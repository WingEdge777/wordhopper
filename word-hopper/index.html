<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Word Hopper</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
    canvas { image-rendering: pixelated; outline: none; }
  </style>
</head>
<body tabindex="0">
  <script>
    window.addEventListener('load', function() {
      var c = document.querySelector('canvas');
      if (c) {
        c.setAttribute('tabindex', '0');
        c.focus();
        c.addEventListener('blur', function() { setTimeout(function() { c.focus(); }, 0); });
        document.addEventListener('click', function() { c.focus(); });
      }
    });
  </script>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
