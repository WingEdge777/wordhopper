name: Deployment

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-files
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://wordhopper.wingedge777.com/
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-files
          path: dist

      - name: Setup SSH Key
        env:
          deploy_key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf "%s\n" "$deploy_key" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Deploy via rsync
        run: |
          rsync -avz \
          --chown=www-data:www-data \
          --delete \
          -e "ssh -p ${{ secrets.VPS_SSH_PORT }} -o BatchMode=yes -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa" \
          dist/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/wordhopper
